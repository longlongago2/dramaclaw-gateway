name: Shared skills links

on:
  push:
    paths:
      - '.agents/**'
      - '.gitignore'
      - 'scripts/init-shared-skills.py'
      - 'scripts/test_init_shared_skills.py'
      - '.github/workflows/shared-skills.yml'
  pull_request:
    paths:
      - '.agents/**'
      - '.gitignore'
      - 'scripts/init-shared-skills.py'
      - 'scripts/test_init_shared_skills.py'
      - '.github/workflows/shared-skills.yml'

permissions:
  contents: read

jobs:
  links:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Verify per-skill links preserve shared and project-owned skills
        run: python scripts/test_init_shared_skills.py
